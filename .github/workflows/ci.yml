name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy neobatista neo_batista.py scripts tests
      - name: Tests
        run: uv run pytest
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neobatista:test .
      - name: Verify runtime dependencies
        run: >
          docker run --rm --entrypoint sh neobatista:test -c
          "python -c 'import discord, yt_dlp, spotipy' && ffmpeg -version && node --version"
